<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements - Campus Assist</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55, #00c6ff);
            min-height: 100vh;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .announcement-card {
            background: rgba(255, 255, 255, 0.13);
            padding: 22px;
            margin: 18px 0;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        }

        .announcement-card h2 {
            color: #8ff3ff;
            margin-top: 0;
        }

        .announcement-card p {
            line-height: 1.6;
        }

        .date {
            font-weight: bold;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 22px;
            background: white;
            color: #243b55;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            background: rgba(255, 255, 255, 0.13);
            padding: 25px;
            border-radius: 18px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📢 Announcements</h1>

    {% if announcements %}

        {% for announcement in announcements %}

        <div class="announcement-card">

            <h2>{{ announcement['title'] }}</h2>

            <p class="date">
                📅 {{ announcement['date'] }}
            </p>

            <p>
                {{ announcement['description'] }}
            </p>

        </div>

        {% endfor %}

    {% else %}

        <div class="empty">
            <h2>No Announcements</h2>
            <p>There are currently no announcements.</p>
        </div>

    {% endif %}

    <a href="/student-dashboard" class="back-btn">
        ← Back to Student Dashboard
    </a>

</div>

</body>
</html>
