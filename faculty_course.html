<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Courses - Campus Assist</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            min-height: 100vh;
            color: white;
        }

        header {
            text-align: center;
            padding: 35px 20px 20px;
        }

        header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 18px;
        }

        .form-container {
            width: 90%;
            max-width: 700px;
            margin: 20px auto 35px;
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .form-container h2 {
            text-align: center;
            color: #11998e;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        .add-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #11998e;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-button:hover {
            background: #0d7f75;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            padding: 10px 0 40px;
        }

        .course-card {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
        }

        .course-card:hover {
            transform: translateY(-8px);
        }

        .course-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .course-card h2 {
            color: #11998e;
            margin-bottom: 15px;
        }

        .course-card p {
            margin: 10px 0;
            font-size: 16px;
        }

        .back-button {
            display: block;
            width: fit-content;
            margin: 10px auto 35px;
            padding: 12px 25px;
            background: white;
            color: #11998e;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>👨‍🏫 Faculty Courses</h1>
        <p>Manage courses in Campus Assist</p>
    </header>


    <!-- Add Course Form -->

    <div class="form-container">

        <h2>➕ Add New Course</h2>

        <form action="/add-course" method="POST">

            <div class="form-group">
                <label>Course Name</label>
                <input
                    type="text"
                    name="course_name"
                    placeholder="Enter course name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Instructor</label>
                <input
                    type="text"
                    name="instructor"
                    placeholder="Enter instructor name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Credits</label>
                <input
                    type="number"
                    name="credits"
                    placeholder="Enter credits"
                    min="1"
                    required
                >
            </div>

            <button type="submit" class="add-button">
                ➕ Add Course
            </button>

        </form>

    </div>


    <!-- Course List -->

    <div class="container">

        {% for course in courses %}

        <div class="course-card">

            <div class="course-icon">📚</div>

            <h2>{{ course['course_name'] }}</h2>

            <p>
                👨‍🏫 <strong>Instructor:</strong>
                {{ course['instructor'] }}
            </p>

            <p>
                🎓 <strong>Credits:</strong>
                {{ course['credits'] }}
            </p>

        </div>

        {% endfor %}

    </div>


    <a href="/faculty-dashboard" class="back-button">
        ⬅️ Back to Dashboard
    </a>

</body>
</html>
