<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Profile - Campus Assist</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55, #00c6ff);
            min-height: 100vh;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            margin: auto;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #d8f7ff;
            margin-bottom: 30px;
        }

        .info {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            margin: 12px 0;
            border-radius: 12px;
            text-align: left;
        }

        .label {
            font-weight: bold;
            color: #8ff3ff;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: white;
            color: #243b55;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #8ff3ff;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="profile-card">

            <div class="avatar">
                👨‍🏫
            </div>

            <h1>{{ faculty['name'] }}</h1>

            <div class="subtitle">
                Faculty Profile
            </div>

            <div class="info">
                <span class="label">Faculty ID:</span>
                {{ faculty['faculty_id'] }}
            </div>

            <div class="info">
                <span class="label">Name:</span>
                {{ faculty['name'] }}
            </div>

            <div class="info">
                <span class="label">Department:</span>
                {{ faculty['department'] }}
            </div>

            <div class="info">
                <span class="label">Designation:</span>
                {{ faculty['designation'] }}
            </div>

            <div class="info">
                <span class="label">Email:</span>
                {{ faculty['email'] }}
            </div>

            <div class="info">
                <span class="label">Academic Status:</span>
                Active Faculty
            </div>

            <a href="/faculty-dashboard" class="back-btn">
                ← Back to Faculty Dashboard
            </a>

        </div>

    </div>

</body>
</html>
